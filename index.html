<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pembelajaran Interaktif</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- KONFIGURASI SCRIPT URL -->
  <script>
    const WEB_APP_URL = "GANTI_DENGAN_URL_WEB_APP_ANDA"; 
    const DRIVE_FOLDER_ID = "GANTI_DENGAN_ID_FOLDER_GOOGLE_DRIVE_ANDA"; 
  </script>

  <!-- NAVBAR -->
  <nav class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fa-solid me-2 fa-graduation-cap"></i> Media Pembelajaran Interaktif
    </h1>
    <div id="navUser" class="hidden flex items-center gap-4">
      <span id="userBadge" class="bg-indigo-700 px-3 py-1 rounded-full text-xs font-semibold"></span>
      <button onclick="logout()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Keluar</button>
    </div>
  </nav>

  <div class="container mx-auto p-4 max-w-4xl">

    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="bg-white rounded-2xl shadow-xl p-6 mt-10 max-w-md mx-auto">
      <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">Pilih Mode Masuk</h2>
      
      <!-- Tab Pilihan -->
      <div class="flex border-b mb-6">
        <button id="btnTabStudent" onclick="switchLoginTab('student')" class="w-1/2 py-2 font-bold border-b-2 border-indigo-600 text-indigo-600">Siswa</button>
        <button id="btnTabTeacher" onclick="switchLoginTab('teacher')" class="w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400">Guru</button>
      </div>

      <!-- Form Siswa -->
      <div id="studentLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">ID Siswa / NIS</label>
          <input type="text" id="studentIdInput" class="w-full border p-2 rounded-xl border-slate-300 focus:outline-indigo-500" placeholder="Masukkan ID Siswa">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">Nama Siswa</label>
          <input type="text" id="studentNameInput" class="w-full border p-2 rounded-xl border-slate-300 focus:outline-indigo-500" placeholder="Masukkan Nama Lengkap">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">PIN Siswa</label>
          <input type="password" id="studentPinInput" class="w-full border p-2 rounded-xl border-slate-300 focus:outline-indigo-500" placeholder="PIN Default: 123">
        </div>
        <button onclick="loginStudent()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-xl hover:bg-indigo-700 transition">Masuk Sebagai Siswa</button>
      </div>

      <!-- Form Guru -->
      <div id="teacherLoginForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">PIN Guru</label>
          <input type="password" id="teacherPinInput" class="w-full border p-2 rounded-xl border-slate-300 focus:outline-indigo-500" placeholder="PIN Default: guru123">
        </div>
        <button onclick="loginTeacher()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl hover:bg-emerald-700 transition">Masuk Sebagai Guru</button>
      </div>
    </div>

    <!-- PORTAL SISWA -->
    <div id="studentSection" class="hidden space-y-6 mt-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
        <div>
          <h3 class="font-bold text-lg text-slate-700" id="welcomeStudent"></h3>
          <p class="text-xs text-slate-500">Pilih tugas minggu ini dan kirimkan jawabanmu.</p>
        </div>
        <button onclick="loadMyGrades()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">⭐ Nilai Saya</button>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-md space-y-4">
        <label class="block font-bold text-sm text-slate-600">Pilih Soal / Minggu Ke-:</label>
        <select id="questionSelect" onchange="onSelectQuestion()" class="w-full border p-2 rounded-xl border-slate-300 font-semibold"></select>

        <div id="questionDetail" class="hidden p-4 bg-indigo-50 rounded-xl space-y-2 border border-indigo-100">
          <h4 id="qTitle" class="font-bold text-indigo-700"></h4>
          <p id="qInstruction" class="text-sm text-slate-600"></p>
          <div id="qVocabContainer" class="flex flex-wrap gap-2 pt-2"></div>
        </div>

        <!-- AREA PENGERJAAN TUGAS -->
        <div id="taskInputContainer" class="hidden space-y-4 pt-4 border-t">
          <!-- Text Response -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Jawaban Teks / Deskripsi:</label>
            <textarea id="textResponseInput" rows="3" class="w-full border border-slate-300 p-2 rounded-xl focus:outline-indigo-500" placeholder="Tuliskan jawabanmu di sini..."></textarea>
          </div>

          <!-- Drawing Upload -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Unggah Gambar / Canvas (Opsional):</label>
            <input type="file" id="imageInput" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
          </div>

          <!-- Audio Recorder -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Rekam Suara (Opsional):</label>
            <div class="flex items-center gap-3">
              <button id="btnRecord" onclick="toggleRecord()" class="bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2">
                <i class="fa-solid fa-microphone"></i> <span id="recordText">Mulai Rekam</span>
              </button>
              <audio id="audioPlayback" controls class="hidden h-10 w-full max-w-xs"></audio>
            </div>
          </div>

          <button onclick="submitStudentTask()" id="btnSubmitTask" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition flex justify-center items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Kirim Tugas
          </button>
        </div>
      </div>
    </div>

    <!-- PORTAL GURU -->
    <div id="teacherSection" class="hidden space-y-6 mt-6">
      <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-700">Daftar Pengiriman Tugas Siswa</h3>
        <button onclick="loadSubmissions()" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded-xl hover:bg-indigo-200">
          <i class="fa-solid fa-rotate"></i> Refresh Data
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- List Submissions -->
        <div class="bg-white p-4 rounded-2xl shadow-md border max-h-[500px] overflow-y-auto space-y-2" id="submissionList">
          <p class="text-xs text-slate-400 text-center">Memuat data pengiriman...</p>
        </div>

        <!-- Detail Assessment Form -->
        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-md border space-y-4" id="assessmentForm">
          <p class="text-slate-400 text-sm text-center py-10">Pilih salah satu tugas siswa dari daftar sebelah kiri untuk dinilai.</p>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL NILAI SAYA -->
  <div id="gradesModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex justify-center items-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-indigo-700">⭐ Nilai Saya</h3>
        <button onclick="closeGradesModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="gradesContent" class="space-y-3 max-h-80 overflow-y-auto">
        <p class="text-xs text-slate-400">Memuat nilai...</p>
      </div>
    </div>
  </div>

  <!-- SCRIPT UTAMA -->
  <script>
    let currentUser = null;
    let questionsData = [];
    let submissionsData = [];
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBase64 = "";

    // 1. Aksi Tab Login
    function switchLoginTab(tab) {
      if (tab === 'student') {
        document.getElementById('studentLoginForm').classList.remove('hidden');
        document.getElementById('teacherLoginForm').classList.add('hidden');
        document.getElementById('btnTabStudent').className = "w-1/2 py-2 font-bold border-b-2 border-indigo-600 text-indigo-600";
        document.getElementById('btnTabTeacher').className = "w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400";
      } else {
        document.getElementById('studentLoginForm').classList.add('hidden');
        document.getElementById('teacherLoginForm').classList.remove('hidden');
        document.getElementById('btnTabStudent').className = "w-1/2 py-2 font-bold border-b-2 border-transparent text-slate-400";
        document.getElementById('btnTabTeacher').className = "w-1/2 py-2 font-bold border-b-2 border-emerald-600 text-emerald-600";
      }
    }

    // 2. Login Siswa
    async function loginStudent() {
      const id = document.getElementById('studentIdInput').value.trim();
      const name = document.getElementById('studentNameInput').value.trim();
      const pin = document.getElementById('studentPinInput').value.trim();

      if (!id || !name || !pin) return alert("Mohon lengkapi seluruh field!");

      try {
        const res = await fetch(`${WEB_APP_URL}?action=verifyStudent&pin=${encodeURIComponent(pin)}`);
        const json = await res.json();

        if (json.status === "success") {
          currentUser = { role: "student", id: id, name: name };
          showSection('student');
          document.getElementById('welcomeStudent').innerText = `Halo, ${name}! (ID: ${id})`;
          loadQuestions();
        } else {
          alert(json.message);
        }
      } catch (e) {
        alert("Gagal terhubung ke backend server!");
      }
    }

    // 3. Login Guru
    async function loginTeacher() {
      const pin = document.getElementById('teacherPinInput').value.trim();
      if (!pin) return alert("Masukkan PIN Guru!");

      try {
        const res = await fetch(`${WEB_APP_URL}?action=verifyTeacher&pin=${encodeURIComponent(pin)}`);
        const json = await res.json();

        if (json.status === "success") {
          currentUser = { role: "teacher" };
          showSection('teacher');
          loadSubmissions();
        } else {
          alert(json.message);
        }
      } catch (e) {
        alert("Gagal terhubung ke backend server!");
      }
    }

    function showSection(role) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('navUser').classList.remove('hidden');
      if (role === 'student') {
        document.getElementById('studentSection').classList.remove('hidden');
        document.getElementById('userBadge').innerText = "Siswa";
      } else {
        document.getElementById('teacherSection').classList.remove('hidden');
        document.getElementById('userBadge').innerText = "Guru";
      }
    }

    function logout() {
      location.reload();
    }

    // 4. Ambil Pertanyaan dari Backend
    async function loadQuestions() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getQuestions`);
        const json = await res.json();
        if (json.status === "success") {
          questionsData = json.data;
          const select = document.getElementById('questionSelect');
          select.innerHTML = '<option value="">-- Pilih Soal --</option>';
          questionsData.forEach((q, idx) => {
            select.innerHTML += `<option value="${idx}">Minggu ${q.week}: ${q.title}</option>`;
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    function onSelectQuestion() {
      const idx = document.getElementById('questionSelect').value;
      if (idx === "") {
        document.getElementById('questionDetail').classList.add('hidden');
        document.getElementById('taskInputContainer').classList.add('hidden');
        return;
      }
      const q = questionsData[idx];
      document.getElementById('qTitle').innerText = `Minggu ${q.week} - ${q.title} (${q.taskType})`;
      document.getElementById('qInstruction').innerText = q.instruction;
      
      const vBox = document.getElementById('qVocabContainer');
      vBox.innerHTML = '';
      q.vocabList.forEach(v => {
        if(v.trim()) vBox.innerHTML += `<span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded-lg font-semibold">${v.trim()}</span>`;
      });

      document.getElementById('questionDetail').classList.remove('hidden');
      document.getElementById('taskInputContainer').classList.remove('hidden');
    }

    // 5. Perekam Audio Browser
    async function toggleRecord() {
      const btn = document.getElementById('btnRecord');
      const text = document.getElementById('recordText');
      const audioPlayback = document.getElementById('audioPlayback');

      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            audioPlayback.src = URL.createObjectURL(audioBlob);
            audioPlayback.classList.remove('hidden');

            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => { audioBase64 = reader.result; };
          };

          mediaRecorder.start();
          btn.classList.replace('bg-red-500', 'bg-slate-700');
          text.innerText = "Berhenti Rekam";
        } catch (e) {
          alert("Akses mikrofon ditolak atau tidak didukung!");
        }
      } else {
        mediaRecorder.stop();
        btn.classList.replace('bg-slate-700', 'bg-red-500');
        text.innerText = "Mulai Rekam Ulang";
      }
    }

    // 6. Pengiriman Tugas Siswa
    async function submitStudentTask() {
      const idx = document.getElementById('questionSelect').value;
      if (idx === "") return alert("Pilih soal terlebih dahulu!");
      
      const q = questionsData[idx];
      const textResp = document.getElementById('textResponseInput').value;
      const imgFile = document.getElementById('imageInput').files[0];
      const btn = document.getElementById('btnSubmitTask');

      btn.disabled = true;
      btn.innerText = "Mengirim...";

      let drawingBase64 = "";
      if (imgFile) {
        drawingBase64 = await new Promise((resolve) => {
          const r = new FileReader();
          r.onload = e => resolve(e.target.result);
          r.readAsDataURL(imgFile);
        });
      }

      const payload = {
        action: "submitTask",
        studentId: currentUser.id,
        studentName: currentUser.name,
        week: q.week,
        taskType: q.taskType,
        textResponse: textResp,
        drawingBase64: drawingBase64,
        audioBase64: audioBase64,
        folderId: DRIVE_FOLDER_ID
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        alert(json.aiFeedback || json.message);
        location.reload();
      } catch (e) {
        alert("Gagal mengirim tugas!");
        btn.disabled = false;
        btn.innerText = "Kirim Tugas";
      }
    }

    // 7. Ambil Data Tugas untuk Guru
    async function loadSubmissions() {
      const listContainer = document.getElementById('submissionList');
      listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center">Memuat data...</p>';

      try {
        const res = await fetch(`${WEB_APP_URL}?action=getSubmissions`);
        const json = await res.json();
        
        if (json.status === "success") {
          submissionsData = json.data;
          if (submissionsData.length === 0) {
            listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center">Belum ada pengiriman tugas.</p>';
            return;
          }

          listContainer.innerHTML = '';
          submissionsData.forEach((sub, i) => {
            const hasGraded = sub.assessment ? true : false;
            listContainer.innerHTML += `
              <div onclick="selectSubmission(${i})" class="p-3 rounded-xl border border-slate-100 hover:bg-indigo-50 cursor-pointer transition">
                <div class="flex justify-between items-start">
                  <h5 class="font-bold text-sm text-slate-700">${sub.studentName}</h5>
                  <span class="text-[10px] px-2 py-0.5 rounded-full ${hasGraded ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} font-bold">
                    ${hasGraded ? 'Dinilai' : 'Belum'}
                  </span>
                </div>
                <p class="text-xs text-slate-500">Minggu ${sub.week} (${sub.taskType})</p>
              </div>`;
          });
        }
      } catch (e) {
        listContainer.innerHTML = '<p class="text-xs text-red-400 text-center">Gagal memuat data.</p>';
      }
    }

    // 8. Tampilkan Form Penilaian Guru
    function selectSubmission(index) {
      const sub = submissionsData[index];
      const form = document.getElementById('assessmentForm');

      let mediaHTML = "";
      if (sub.drawingUrl) {
        mediaHTML += `<div class="mb-2"><label class="text-xs font-bold text-slate-500">Gambar/Canvas:</label><br><a href="${sub.drawingUrl}" target="_blank" class="text-xs text-indigo-600 underline">Lihat Gambar</a></div>`;
      }
      if (sub.audioUrl) {
        const fileIdMatch = sub.audioUrl.match(/[-\w]{25,}/);
        if (fileIdMatch) {
          const embedUrl = `https://drive.google.com/file/d/${fileIdMatch[0]}/preview`;
          mediaHTML += `<div class="mb-2"><label class="text-xs font-bold text-slate-500">Rekaman Audio:</label><iframe src="${embedUrl}" class="w-full h-16 rounded-xl border border-sky-200 mt-1" allow="autoplay"></iframe></div>`;
        } else {
          mediaHTML += `<div class="mb-2"><audio controls class="w-full mt-1"><source src="${sub.audioUrl}"></audio></div>`;
        }
      }

      const ass = sub.assessment || {};

      form.innerHTML = `
        <h4 class="font-bold text-lg text-indigo-700 border-b pb-2">Penilaian: ${sub.studentName} (Minggu ${sub.week})</h4>
        <div class="bg-slate-50 p-3 rounded-xl border space-y-2">
          <p class="text-xs text-slate-600"><strong>Teks Jawaban:</strong> ${sub.textResponse || '-'}</p>
          ${mediaHTML}
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-500">Nilai Tugas</label>
            <input type="number" id="scoreTask" value="${ass.scoreTask || 80}" class="w-full border p-2 rounded-xl text-sm border-slate-300">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500">Kosakata</label>
            <input type="number" id="scoreVocab" value="${ass.scoreVocab || 80}" class="w-full border p-2 rounded-xl text-sm border-slate-300">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500">Kelancaran</label>
            <input type="number" id="scoreFluency" value="${ass.scoreFluency || 80}" class="w-full border p-2 rounded-xl text-sm border-slate-300">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">Catatan Guru / Feedback</label>
          <textarea id="teacherFeedback" rows="2" class="w-full border p-2 rounded-xl text-sm border-slate-300">${ass.teacherFeedback || ''}</textarea>
        </div>

        <button onclick="saveGrade('${sub.submissionId}', '${sub.studentId}', '${sub.week}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl transition">
          Simpan Nilai
        </button>`;
    }

    // 9. Simpan Nilai Guru
    async function saveGrade(subId, studentId, week) {
      const scoreTask = Number(document.getElementById('scoreTask').value);
      const scoreVocab = Number(document.getElementById('scoreVocab').value);
      const scoreFluency = Number(document.getElementById('scoreFluency').value);
      const feedback = document.getElementById('teacherFeedback').value;

      const finalScore = Math.round((scoreTask + scoreVocab + scoreFluency) / 3);

      const payload = {
        action: "saveGrade",
        submissionId: subId,
        studentId: studentId,
        week: week,
        scoreTask: scoreTask,
        scoreVocab: scoreVocab,
        scoreFluency: scoreFluency,
        finalScore: finalScore,
        feedback: feedback
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        alert(json.message);
        loadSubmissions();
      } catch (e) {
        alert("Gagal menyimpan nilai!");
      }
    }

    // 10. Modal Nilai Siswa
    async function loadMyGrades() {
      document.getElementById('gradesModal').classList.remove('hidden');
      const container = document.getElementById('gradesContent');
      container.innerHTML = '<p class="text-xs text-slate-400">Memuat nilai...</p>';

      try {
        const res = await fetch(`${WEB_APP_URL}?action=getStudentGrades&studentId=${encodeURIComponent(currentUser.id)}`);
        const json = await res.json();

        if (json.status === "success" && json.data.length > 0) {
          container.innerHTML = '';
          json.data.forEach(g => {
            container.innerHTML += `
              <div class="p-3 rounded-xl border border-indigo-100 bg-indigo-50/50 space-y-1">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-xs text-indigo-700">Minggu ${g.week} (${g.taskType})</span>
                  <span class="text-sm font-extrabold ${g.finalScore ? 'text-emerald-600' : 'text-slate-400'}">
                    ${g.finalScore !== null ? 'Nilai: ' + g.finalScore : 'Belum Dinilai'}
                  </span>
                </div>
                <p class="text-xs text-slate-600"><strong>Catatan:</strong> ${g.teacherFeedback || '-'}</p>
              </div>`;
          });
        } else {
          container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada nilai yang tersedia.</p>';
        }
      } catch (e) {
        container.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Gagal memuat nilai.</p>';
      }
    }

    function closeGradesModal() {
      document.getElementById('gradesModal').classList.add('hidden');
    }
  </script>
</body>
</html>
