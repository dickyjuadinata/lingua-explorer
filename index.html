<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaExplorer KIDS</title>
  <style>
    :root {
      --bg-color: #fdf6e2;
      --card-bg: #ffffff;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --secondary: #0d9488;
      --text: #1f2937;
      --border: #fcd34d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary);
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #fef08a;
      color: #854d0e;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .section {
      margin-bottom: 25px;
    }

    .section h3 {
      color: #b45309;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #374151;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .canvas-container {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      text-align: center;
      padding: 10px;
      background: #f8fafc;
    }

    canvas {
      border: 1px solid #94a3b8;
      background: #ffffff;
      border-radius: 6px;
      cursor: crosshair;
    }

    .audio-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.btn-secondary {
      background-color: var(--secondary);
    }

    button.btn-secondary:hover {
      background-color: #0f766e;
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      background-color: #10b981;
      padding: 15px;
      font-size: 18px;
    }

    .btn-submit:hover {
      background-color: #059669;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 3px solid var(--primary);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-content h2 {
      color: #d97706;
      margin-bottom: 15px;
    }

    .modal-body {
      background: #fef3c7;
      border-radius: 10px;
      padding: 15px;
      font-size: 15px;
      color: #92400e;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .loading-spinner {
      display: none;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🦁 LinguaExplorer <span class="badge">KIDS</span></h1>
    <div>Siswa: <strong id="studentInfo">123 (STD-123)</strong></div>
  </div>

  <div class="container">
    <form id="taskForm">
      
      <div class="section">
        <h3>1. Informasi Tugas</h3>
        <div class="form-group">
          <label>ID Siswa:</label>
          <input type="text" id="studentId" value="STD123" required>
        </div>
        <div class="form-group">
          <label>Nama Siswa:</label>
          <input type="text" id="studentName" value="Budi" required>
        </div>
        <div class="form-group">
          <label>Pilih Minggu (Week):</label>
          <select id="weekSelect">
            <option value="1">Minggu 1 - Animal World</option>
            <option value="2">Minggu 2 - Solar System</option>
            <option value="3">Minggu 3 - Plant Life</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jenis Tugas:</label>
          <input type="text" id="taskType" value="Weekly English & Science Task" readonly>
        </div>
      </div>

      <div class="section">
        <h3>2. Jawaban Teks</h3>
        <textarea id="textResponse" rows="4" placeholder="Tuliskan jawaban bahasa Inggris atau sains kamu di sini..."></textarea>
      </div>

      <div class="section">
        <h3>3. Gambar / Sketsa (Opsional)</h3>
        <div class="canvas-container">
          <canvas id="drawCanvas" width="400" height="200"></canvas>
          <div style="margin-top: 8px;">
            <button type="button" class="btn-secondary" onclick="clearCanvas()">Hapus Gambar</button>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>4. Rekam Suara (Opsional)</h3>
        <div class="audio-controls">
          <button type="button" id="recordBtn" class="btn-secondary" onclick="toggleRecording()">🎤 Mulai Rekam</button>
          <audio id="audioPreview" controls style="display: none; height: 40px;"></audio>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>🚀 Kirim Tugas Sekarang!</span>
      </button>
      <div class="loading-spinner" id="loadingSpinner" style="margin-top: 15px;"></div>
    </form>
  </div>

  <div class="modal-overlay" id="aiModal">
    <div class="modal-content">
      <h2>🤖 Feedback Robot Pintar AI</h2>
      <p style="font-size: 13px; color: #6b7280; margin-bottom: 10px;">Evaluasi Otomatis Tugasmu</p>
      <div class="modal-body" id="aiFeedbackText">
        Sedang memproses...
      </div>
      <button type="button" onclick="closeModal()">Hore, Mengerti! 👍</button>
    </div>
  </div>

  <script>
    // ENDPOINT DIGUNAKAN SESUAI TAUTAN WEB APP ANDA
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwgcfcfMx9CfCx-njEdz336BayzaUSUoH375cQ5X-3J1UK_ANsVzamK_CblIcp4FXps/exec";

    let isDrawing = false;
    let canvas, ctx;
    let mediaRecorder, audioChunks = [];
    let audioBase64 = "";

    window.onload = function() {
      canvas = document.getElementById('drawCanvas');
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000000';

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); e.preventDefault(); });
      canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
      canvas.addEventListener('touchend', stopDrawing);
    };

    function startDrawing(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    async function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');

      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              audioBase64 = reader.result;
              const audioPreview = document.getElementById('audioPreview');
              audioPreview.src = audioBase64;
              audioPreview.style.display = 'inline-block';
            };
          };

          mediaRecorder.start();
          recordBtn.textContent = '⏹️ Hentikan Rekaman';
          recordBtn.style.backgroundColor = '#ef4444';
        } catch (err) {
          alert('Mikrofon tidak diizinkan atau tidak ditemukan.');
        }
      } else if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordBtn.textContent = '🎤 Rekam Ulang';
        recordBtn.style.backgroundColor = 'var(--secondary)';
      }
    }

    document.getElementById('taskForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('loadingSpinner');
      
      submitBtn.disabled = true;
      spinner.style.display = 'block';

      const drawingBase64 = canvas.toDataURL('image/png');

      const payload = {
        action: "submitTask",
        studentId: document.getElementById('studentId').value,
        studentName: document.getElementById('studentName').value,
        week: document.getElementById('weekSelect').value,
        taskType: document.getElementById('taskType').value,
        textResponse: document.getElementById('textResponse').value,
        drawingBase64: drawingBase64,
        audioBase64: audioBase64
      };

      try {
        const response = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showModal(result.aiFeedback || "Tugas berhasil dikirim!");
        } else {
          showModal("⚠️ Gagal: " + (result.message || "Terjadi kesalahan pada server."));
        }
      } catch (err) {
        showModal("⚠️ Error koneksi: Gagal terhubung ke Database Apps Script.");
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = 'none';
      }
    });

    function showModal(text) {
      document.getElementById('aiFeedbackText').textContent = text;
      document.getElementById('aiModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('aiModal').style.display = 'none';
    }
  </script>
</body>
</html>
