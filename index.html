<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pembelajaran Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <!-- LAYAR LOGIN -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-sky-600">Selamat Datang! 👋</h1>
        <p class="text-slate-400 text-xs mt-1">Masukkan data dirimu untuk mulai belajar</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap</label>
          <input type="text" id="studentNameInput" placeholder="Masukkan nama..." required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Kelas / Student ID</label>
          <input type="text" id="studentClassInput" placeholder="Contoh: 123" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">PIN Masuk Siswa</label>
          <input type="password" id="studentPinInput" placeholder="PIN (default: 123)" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm">
        </div>

        <button type="submit" id="btnLogin"
          class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-sm">
          Masuk Aplikasi 🚀
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="mainApp" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
      <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
        <div>
          <h2 id="displayStudentName" class="font-extrabold text-sky-600 text-base">Nama Siswa</h2>
          <p class="text-[11px] text-slate-400">Student ID: <span id="displayStudentClass" class="font-bold text-slate-600">-</span></p>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="openGradesModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold px-3 py-2 rounded-xl">
            ⭐ Nilai Saya
          </button>
          <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-3 py-2 rounded-xl">
            Keluar
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
      <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm">Minggu 1: Animal Adaptation</h3>
          <span class="bg-sky-100 text-sky-700 text-[10px] font-bold px-2.5 py-1 rounded-full">Draw & Describe</span>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tulis deskripsi tugasmu:</label>
          <textarea id="textTask_M1" rows="3" placeholder="Tuliskan jawaban deskripsi di sini..."
            class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-sky-400 focus:outline-none"></textarea>
        </div>

        <button onclick="submitTask(1, 'Draw & Describe')" id="btnSubmit_M1"
          class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs transition-all">
          🚀 Kirim Tugas Minggu 1
        </button>
      </div>
    </main>
  </div>

  <!-- MODAL RAPOR & NILAI -->
  <div id="gradesModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h3 class="font-extrabold text-slate-800 text-base">⭐ Rapor & Catatan Guru</h3>
        </div>
        <button onclick="closeGradesModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <div id="studentGradesList" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>

      <button onclick="closeGradesModal()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl text-xs">
        Tutup
      </button>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwgcfcfMx9CfCx-njEdz336BayzaUSUoH375cQ5X-3J1UK_ANsVzamK_CblIcp4FXps/exec";
    const DRIVE_FOLDER_ID = "19T7hUj80EBtXPJ-ZA_02vMHovz25AwlH";

    let currentStudent = { name: "", classId: "" };

    async function handleLogin(e) {
      e.preventDefault();
      const nameVal = document.getElementById('studentNameInput').value.trim();
      const classVal = document.getElementById('studentClassInput').value.trim();
      const pinVal = document.getElementById('studentPinInput').value.trim();

      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memeriksa... ⏳";
      btn.disabled = true;

      try {
        const res = await fetch(`${GAS_ENDPOINT}?action=verifyStudent&pin=${encodeURIComponent(pinVal)}`);
        const result = await res.json();

        if (result.status === "success") {
          currentStudent.name = nameVal;
          currentStudent.classId = classVal;

          document.getElementById('displayStudentName').innerText = currentStudent.name;
          document.getElementById('displayStudentClass').innerText = currentStudent.classId;

          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('mainApp').classList.remove('hidden');
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server.");
      } finally {
        btn.innerText = "Masuk Aplikasi 🚀";
        btn.disabled = false;
      }
    }

    async function submitTask(weekNum, taskType) {
      const textVal = document.getElementById(`textTask_M${weekNum}`).value.trim();
      if (!textVal) {
        alert("Tuliskan jawabanmu terlebih dahulu!");
        return;
      }

      const btn = document.getElementById(`btnSubmit_M${weekNum}`);
      btn.innerText = "Mengirim... ⏳";
      btn.disabled = true;

      const payload = {
        action: "submitTask",
        folderId: DRIVE_FOLDER_ID,
        studentId: currentStudent.classId,
        studentName: currentStudent.name,
        week: weekNum,
        taskType: taskType,
        textResponse: textVal,
        drawingBase64: "",
        audioBase64: ""
      };

      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          alert("Tugas Berhasil Terkirim ke Spreadsheet!");
          document.getElementById(`textTask_M${weekNum}`).value = "";
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi.");
      } finally {
        btn.innerText = `🚀 Kirim Tugas Minggu ${weekNum}`;
        btn.disabled = false;
      }
    }

    async function fetchStudentGrades() {
      const container = document.getElementById('studentGradesList');
      container.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">Mengambil data nilai... ⏳</p>`;

      try {
        const cleanId = encodeURIComponent(String(currentStudent.classId).trim());
        const res = await fetch(`${GAS_ENDPOINT}?action=getStudentGrades&studentId=${cleanId}`);
        const result = await res.json();

        if (result.status === "success" && result.data && result.data.length > 0) {
          container.innerHTML = result.data.map(item => {
            const hasScore = item.finalScore !== null;
            return `
              <div class="bg-sky-50/80 border-2 border-sky-100 rounded-2xl p-4 space-y-2">
                <div class="flex justify-between items-center gap-2">
                  <span class="font-bold text-sky-900 text-xs">Minggu ${item.week} - ${item.taskType}</span>
                  ${hasScore 
                    ? `<span class="bg-emerald-500 text-white font-extrabold text-[11px] px-3 py-1 rounded-full">Nilai: ${item.finalScore}/100</span>`
                    : `<span class="bg-amber-400 text-amber-950 font-bold text-[10px] px-2.5 py-1 rounded-full">⏳ Menunggu Penilaian</span>`
                  }
                </div>

                ${hasScore ? `
                  <div class="text-xs bg-white p-3 rounded-xl border border-sky-100 mt-2">
                    <strong>💬 Pesan Guru:</strong>
                    <p class="mt-1 text-slate-700 font-medium">${item.teacherFeedback || "Sangat baik!"}</p>
                  </div>
                ` : `
                  <p class="text-[11px] text-slate-400 italic">Tugas telah dicatat di sheet Tasks dan menunggu diperiksa guru.</p>
                `}
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = `<p class="text-center text-slate-500 py-6 text-xs">Belum ada tugas terkirim untuk Student ID: <span class="text-sky-600">${currentStudent.classId}</span></p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-center text-rose-500 py-6 text-xs">Gagal memuat nilai.</p>`;
      }
    }

    function openGradesModal() {
      document.getElementById('gradesModal').classList.remove('hidden');
      fetchStudentGrades();
    }

    function closeGradesModal() {
      document.getElementById('gradesModal').classList.add('hidden');
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
