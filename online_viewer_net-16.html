<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaExplorer - Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-emerald-600 text-white p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-wide">🌿 LinguaExplorer</h1>
    <div class="bg-emerald-700 px-3 py-1 rounded-full text-sm">
      Siswa: <span id="student-name" class="font-semibold">Budi (Kelas 3)</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Pre-Task: Vocab Cards -->
    <section class="bg-white p-6 rounded-2xl shadow-md border-2 border-emerald-100">
      <h2 class="text-xl font-bold text-emerald-800 mb-2">1. Pre-Task: Vocab Builder (Week 1)</h2>
      <p class="text-sm text-slate-600 mb-4">Klik kata untuk mendengarkan pengucapan:</p>
      
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <button onclick="speak('Habitat')" class="p-3 bg-amber-100 hover:bg-amber-200 rounded-xl font-bold text-amber-900 shadow-sm transition">
          🔊 Habitat
        </button>
        <button onclick="speak('Camouflage')" class="p-3 bg-amber-100 hover:bg-amber-200 rounded-xl font-bold text-amber-900 shadow-sm transition">
          🔊 Camouflage
        </button>
        <button onclick="speak('Predator')" class="p-3 bg-amber-100 hover:bg-amber-200 rounded-xl font-bold text-amber-900 shadow-sm transition">
          🔊 Predator
        </button>
        <button onclick="speak('Desert')" class="p-3 bg-amber-100 hover:bg-amber-200 rounded-xl font-bold text-amber-900 shadow-sm transition">
          🔊 Desert
        </button>
      </div>
    </section>

    <!-- Main Task: Draw & Record Studio -->
    <section class="bg-white p-6 rounded-2xl shadow-md border-2 border-emerald-100">
      <h2 class="text-xl font-bold text-emerald-800 mb-2">2. Main Task: Studio "Super Animal"</h2>
      
      <!-- Studio Canvas -->
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Gambar Hewan Super Kamu:</label>
        <canvas id="drawCanvas" width="400" height="250" class="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 w-full touch-none"></canvas>
        <button onclick="clearCanvas()" class="mt-2 px-3 py-1 bg-slate-200 text-xs rounded-lg hover:bg-slate-300">Bersihkan Gambar</button>
      </div>

      <!-- Audio Recorder -->
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Rekam Deskripsi Lisan (Maks 1 Menit):</label>
        <div class="flex items-center gap-3">
          <button id="recBtn" onclick="toggleRecording()" class="px-4 py-2 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 shadow">
            🎙️ Mulai Rekam
          </button>
          <audio id="audioPreview" controls class="hidden h-10"></audio>
        </div>
      </div>
    </section>

    <!-- Form-Focus: Sentence Builder -->
    <section class="bg-white p-6 rounded-2xl shadow-md border-2 border-emerald-100">
      <h2 class="text-xl font-bold text-emerald-800 mb-2">3. Form-Focus: Sentence Builder</h2>
      <p class="text-sm text-slate-600 mb-3">Susun kalimat deskripsi habitat hewanmu:</p>
      
      <div id="sentence-target" class="p-3 min-h-[50px] bg-slate-100 border-2 border-emerald-300 rounded-xl flex flex-wrap gap-2 mb-3">
        <!-- Word blocks will drop here -->
      </div>

      <div id="word-bank" class="flex flex-wrap gap-2">
        <span onclick="addWord(this)" class="px-3 py-1.5 bg-emerald-100 text-emerald-900 rounded-lg font-medium cursor-pointer hover:bg-emerald-200">It lives in</span>
        <span onclick="addWord(this)" class="px-3 py-1.5 bg-emerald-100 text-emerald-900 rounded-lg font-medium cursor-pointer hover:bg-emerald-200">the desert</span>
        <span onclick="addWord(this)" class="px-3 py-1.5 bg-emerald-100 text-emerald-900 rounded-lg font-medium cursor-pointer hover:bg-emerald-200">and uses</span>
        <span onclick="addWord(this)" class="px-3 py-1.5 bg-emerald-100 text-emerald-900 rounded-lg font-medium cursor-pointer hover:bg-emerald-200">camouflage</span>
      </div>
      <button onclick="resetSentence()" class="mt-3 text-xs text-rose-600 underline block">Reset Kalimat</button>
    </section>

    <!-- Submit Button -->
    <button onclick="submitAll()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-emerald-700 transition">
      🚀 Kirim Tugas ke Guru
    </button>
  </main>

  <script>
    // masukkan Web App URL dari deployment Apps Script Anda
    const GAS_ENDPOINT = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    // Text-to-Speech Engine
    function speak(text) {
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'en-US';
      msg.rate = 0.8; // Diperlambat untuk anak-anak
      window.speechSynthesis.speak(msg);
    }

    // Drawing Canvas
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#059669';
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Audio Recorder Engine
    let mediaRecorder, audioChunks = [], audioBase64 = null;
    
    async function toggleRecording() {
      const btn = document.getElementById('recBtn');
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          document.getElementById('audioPreview').src = URL.createObjectURL(blob);
          document.getElementById('audioPreview').classList.remove('hidden');
          
          // Convert to Base64
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => { audioBase64 = reader.result; };
        };

        mediaRecorder.start();
        btn.innerText = "⏹️ Hentikan Rekaman";
        btn.classList.replace('bg-rose-500', 'bg-slate-700');
      } else {
        mediaRecorder.stop();
        btn.innerText = "🎙️ Rekam Ulang";
        btn.classList.replace('bg-slate-700', 'bg-rose-500');
      }
    }

    // Sentence Builder Engine
    function addWord(el) {
      const target = document.getElementById('sentence-target');
      target.appendChild(el);
    }

    function resetSentence() {
      const target = document.getElementById('sentence-target');
      const bank = document.getElementById('word-bank');
      while (target.firstChild) {
        bank.appendChild(target.firstChild);
      }
    }

    // Send Payload to Backend
    async function submitAll() {
      const imageBase64 = canvas.toDataURL('image/png');
      const sentenceText = Array.from(document.getElementById('sentence-target').children)
                                .map(c => c.innerText).join(' ');

      if(!sentenceText) {
        alert("Silakan susun kalimat terlebih dahulu!");
        return;
      }

      alert("Mengirim tugas, mohon tunggu...");

      const payload = {
        action: "submitTask",
        studentId: "STD-001",
        week: 1,
        taskType: "Super Animal Task",
        textResponse: sentenceText,
        fileBase64: audioBase64 || imageBase64,
        fileName: audioBase64 ? "recording_week1.webm" : "drawing_week1.png"
      };

      try {
        const response = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        if(res.status === "success") {
          alert("Tugas Berhasil Terkirim! 🎉");
        } else {
          alert("Gagal mengirim: " + res.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan pengiriman koneksi.");
      }
    }
  </script>
</body>
</html>
